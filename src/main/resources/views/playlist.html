<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист - VplaY</title>
    <link rel="stylesheet" href="/css/main.css">
	<link rel="stylesheet" href="/css/playlist.css">
	<script src="/js/player.js"></script>
</head>
<body>
    <!-- Меню -->
    <div class="menu">
        <div class="container">
            <a href="/" class="logo">VplaY</a>
            <a href="/playlist">Плейлист</a>
            <a href="/add_music">Загрузить</a>
        </div>
    </div>

    <!-- Основной контент с отступом для плеера -->
    <div class="content-wrapper">
        <div class="container">
            <h1 style="color: #8B0000; margin-bottom: 20px;">Ваш плейлист</h1>
            
            <!-- Список песен -->
            <div class="playlist">
                <div th:if="${songs.empty}" class="playlist-empty">
                    Пока нет песен. <a href="/add_music" style="color: #8B0000;">Загрузите первую!</a>
                </div>
                
                <div th:each="song : ${songs}" class="song-item">
                    <!-- Обложка -->
                    <img src="/images/disk.jpg" alt="cover" class="song-cover">
                    
                    <!-- Информация о песне -->
                    <div class="song-info">
                        <div class="song-title" th:text="${song.title}">Название</div>
                        <div class="song-artist" th:text="${song.artist}">Исполнитель</div>
                    </div>
                    
                    <div class="song-duration" th:text="${song.formattedDuration}">?:??</div>
                    
                    <!-- Дата добавления (пока заглушка) -->
                    <div class="song-date" th:text="${song.formattedDate}">??.??.????</div>
                    
                    <!-- Кнопки действий -->
                    <div class="song-actions">
						<button class="song-btn-play" th:onclick="buttonPlaySong([[${song.id}]], [[${song.title}]], [[${song.artist}]], [[${song.filename}]])"
							title="Воспроизвести">▶</button>
                        <button class="song-btn-delete" title="Удалить">🗑️</button>
                    </div>
                </div>
            </div>
            
            <!-- Демо-заметка (потом уберем) -->
            <div class="demo-note">
                ⏳ Пока это дизайн. В пункте 5 добавим настоящее воспроизведение,<br>
                в пункте 6-7 — базу данных и загрузку, а в пункте 9 — удаление.
            </div>
        </div>
    </div>

    <!-- Прикрепленный плеер (нижняя панель) -->
    <div class="player-bar">
        <div class="player-container">
            <!-- Кнопки управления -->
            <div class="player-controls">
                <button class="player-btn" title="Предыдущий">⏮</button>
                <button class="player-btn play-pause" id="player-btn-play-pause" onclick="buttonPausePlay()" title="Воспроизвести">▶</button>
                <button class="player-btn" title="Следующий">⏭</button>
            </div>
            
            <!-- Информация о текущем треке -->
            <div class="player-info">
				<div class="player-song-title" id="player-song-title">Название</div>
				    <div class="player-song-artist" id="player-song-artist">Исполнитель</div>
            </div>
            
            <!-- Прогресс бар -->
            <div class="player-progress-container">
                <span class="progress-time" id="progress-time">?:??</span>
                <div class="progress-bar" onclick="buttonSeek(event)">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <span class="player-duration" id="player-duration">?:??</span>
            </div>
        </div>
    </div>

    <!-- Подвал (немного скорректирован из-за фиксированного плеера) -->
    <div class="footer" style="margin-bottom: 80px;">
        <div class="container">
            VplaY © 2026
        </div>
    </div>
</body>
</html>
