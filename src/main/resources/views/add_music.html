<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузить музыку - VplaY</title>
    <link rel="stylesheet" href="/css/main.css">
	<link rel="stylesheet" href="/css/add_music.css">
</head>
<body>
    <!-- Меню -->
    <div class="menu">
        <div class="container">
            <a href="/" class="logo">VplaY</a>
            <a href="/playlist">Плейлист</a>
            <a href="/add_music">Загрузить</a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <h1 style="color: #8B0000; text-align: center; margin: 30px 0;">
            Загрузить новую песню
        </h1>

        <div class="upload-form">
            <!-- Сообщение об ошибке -->
            <div class="error-message" th:if="${errors}" th:text="${errors}">
                Ошибка при загрузке
            </div>

            <!-- Форма загрузки -->
			<form th:action="@{/add_music_api}" method="POST" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="songFile">Аудиофайл *</label>
                    <input type="file" name="songFile"
                           accept="audio/*">
                    <div class="note">Поддерживаются форматы MP3, WAV, M4A</div>
                </div>

                <button type="submit" class="submit-btn">
                    Загрузить песню
                </button>
            </form>

            <a href="/playlist" class="back-link">← Вернуться к плейлисту</a>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        <div class="container">
            VplaY copy 2026
        </div>
    </div>
</body>
</html>
