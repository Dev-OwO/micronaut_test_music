<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузить музыку - VplaY</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .upload-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: 40px auto;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.1);
            border: 1px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #8B0000;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B0000;
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.3);
        }

        .form-group input[type="file"] {
            padding: 8px;
            border: 1px dashed #8B0000;
            background: #fff5f5;
        }

        .submit-btn {
            background-color: #8B0000;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #a00000;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
        }

        .success-message {
            color: #2e7d32;
            background-color: #e8f5e9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
        }

        .note {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8B0000;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Меню -->
    <div class="menu">
        <div class="container">
            <a href="/" class="logo">VplaY</a>
            <a href="/playlist">Плейлист</a>
            <a href="/add_music">Загрузить</a>
        </div>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <h1 style="color: #8B0000; text-align: center; margin: 30px 0;">
            Загрузить новую песню
        </h1>

        <div class="upload-form">
            <!-- Сообщение об ошибке -->
            <div class="error-message" th:if="${errors}" th:text="${errors}">
                Ошибка при загрузке
            </div>

            <!-- Форма загрузки -->
			<form th:action="@{/add_music_api_dto}" method="POST" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="songFile">Аудиофайл *</label>
                    <input type="file" name="songFile"
                           accept="audio/*">
                    <div class="note">Поддерживаются форматы MP3, WAV, M4A</div>
                </div>

                <button type="submit" class="submit-btn">
                    Загрузить песню
                </button>
            </form>

                    <label for="title">Название песни *</label>
                    <input th:value="*{title}" type="text" name="title"
                           placeholder="Введите название песни">
                </div>

                <div class="form-group">
                    <label for="artist">Исполнитель *</label>
                    <input th:value="*{artist}" type="text" name="artist"
                           placeholder="Введите имя исполнителя">
                </div>

                <div class="form-group">
                    <label for="songFile">Аудиофайл *</label>
                    <input type="file" name="songFile"
                           accept="audio/*">
                    <div class="note">Поддерживаются форматы MP3, WAV, M4A</div>
                </div>

                <button type="submit" class="submit-btn">
                    Загрузить песню
                </button>
            </form> -->

            <a href="/playlist" class="back-link">← Вернуться к плейлисту</a>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        <div class="container">
            VplaY copy 2026
        </div>
    </div>
</body>
</html>
