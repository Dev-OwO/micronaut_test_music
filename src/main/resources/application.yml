micronaut:
  application:
    name: micronaut_test_music
  views:
    thymeleaf:
      enabled: true
      cacheable: false
  router:
    static-resources:
      css:
        paths: classpath:static/css
        mapping: /css/**
      images:
        paths: classpath:static/images
        mapping: /images/**
      audio:
        paths: classpath:static/audio
        mapping: /audio/**
      js:
        paths: classpath:static/js
        mapping: /js/**
  server:
    multipart:
      max-file-size: 10485760  # 10 MB
      max-request-size: 11534336  # 11 MB

datasources:
  default:
    url: jdbc:sqlite:./vplay.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    schema-generate: NONE  # Liquibase управляет схемой

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        dialect: org.hibernate.community.dialect.SQLiteDialect
        show_sql: true # показывать ли в консоли выполняемые запросы
#        format_sql: true # форматировать ли выводимые запросы в несколько строк

liquibase:
  datasources:
    default:
      change-log: classpath:db/changelog/db.changelog-master.yaml

